# Services de développement local (ADR 0014). Démarrage : docker compose up -d
# Même version majeure de Postgres qu'en production (Coolify).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lisnard
      POSTGRES_PASSWORD: lisnard
      POSTGRES_DB: lisnard
    ports:
      # 5433 côté hôte : évite le conflit avec un autre Postgres local sur 5432.
      - "5433:5432"
    volumes:
      # Postgres 18+ : monter /var/lib/postgresql (et non plus .../data).
      - lisnard-play-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisnard -d lisnard"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  lisnard-play-pgdata:
