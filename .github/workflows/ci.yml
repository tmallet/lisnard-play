# CI (ADR 0009, ADR 0010) : versions d'outils lues depuis .tool-versions, sans asdf sur le runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check + smoke web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Même version majeure qu'en production (ADR 0014).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lisnard
          POSTGRES_PASSWORD: lisnard
          POSTGRES_DB: lisnard
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lisnard -d lisnard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://lisnard:lisnard@localhost:5433/lisnard
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Format, lint, types, tests, docs
        run: bun run check

      - name: Smoke test web
        run: bun run smoke:web
